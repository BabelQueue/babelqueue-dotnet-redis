name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A real Redis: the Lua scripts and the redis_layout behavioural conformance blocks run for
    # real (BQ_REQUIRE_REDIS makes an unreachable broker fail the run instead of skipping).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      BQ_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/BabelQueue.Redis/BabelQueue.Redis.csproj -c Release -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          # Same set the old inline push sent: dotnet nuget push also picks up the sibling .snupkg.
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 1

      - name: Upload conformance results
        uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: ${{ runner.temp }}/results.json
          if-no-files-found: error
          retention-days: 1

  # Runs only after build + tests passed. The only job (besides the dry run) that can request
  # an OIDC token, so third-party build/test code never sees ACTIONS_ID_TOKEN_REQUEST_*.
  publish:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: Download conformance results
        uses: actions/download-artifact@v4
        with:
          name: conformance-results
          path: ${{ runner.temp }}

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # The cross-SDK conformance results (ADR-0032) ride along as a release asset.
          files: ${{ runner.temp }}/results.json

  # Manual dry run: exercises only the NuGet Trusted Publishing login (no test, pack, push
  # or GitHub release), so the nuget.org policy can be verified without cutting a version.
  verify-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Verify the short-lived API key was issued
        env:
          KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "Trusted Publishing login OK"
          else
            echo "Trusted Publishing login returned an empty API key" >&2
            exit 1
          fi
