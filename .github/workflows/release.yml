name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # A real Redis: the Lua scripts and the redis_layout behavioural conformance blocks run for
    # real (BQ_REQUIRE_REDIS makes an unreachable broker fail the run instead of skipping).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      BQ_REQUIRE_REDIS: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        env:
          BQ_CONFORMANCE_RESULTS: ${{ runner.temp }}/results.json
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack src/BabelQueue.Redis/BabelQueue.Redis.csproj -c Release -o artifacts

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # The cross-SDK conformance results (ADR-0032) ride along as a release asset.
          files: ${{ runner.temp }}/results.json
